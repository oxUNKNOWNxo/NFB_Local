name: Fix v7.2.0 Japanese localization

on:
  push:
    branches:
      - 'automation/upstream-v7-work-20261017-v720'
    paths:
      - '.fix-v720-ja'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add missing Japanese strings
        run: |
          set -euo pipefail
          FILE='layout/Library/Application Support/BHT/BHTwitter.bundle/ja.lproj/Localizable.strings'
          if ! grep -Fq '"POST_INTERACTIONS_COUNTS_TITLE"' "$FILE"; then
            printf '\n%s\n' '/*Post interaction counts / source labels (v7.2.0)*/' >> "$FILE"
            printf '%s\n' '"POST_INTERACTIONS_COUNTS_TITLE" = "引用: %@  リポスト: %@";' >> "$FILE"
            printf '%s\n' '"POST_INTERACTIONS_UNROUNDED_COUNTS_TITLE" = "引用: %lld  リポスト: %lld";' >> "$FILE"
            printf '%s\n' '"RESTORE_TWEET_LABELS_TITLE" = "投稿元ラベルを表示";' >> "$FILE"
            printf '%s\n' '"RESTORE_TWEET_LABELS_DETAIL" = "ポストがどのクライアントから投稿されたかを表示します。";' >> "$FILE"
          fi
          rm -f .fix-v720-ja .validate-work-source
          rm -f .github/workflows/fix-v720-ja.yml

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'localize: complete Japanese strings for v7.2.0'
          git push origin HEAD:${GITHUB_REF_NAME}
