name: Validate work source

on:
  push:
    branches:
      - 'automation/upstream-v7-work-*'
    paths:
      - '.validate-work-source'

permissions:
  contents: read

jobs:
  validate:
    name: Validate localization and source state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject conflict markers
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' src layout control; then
            echo 'Conflict marker found.' >&2
            exit 1
          fi

      - name: Validate Japanese localization
        run: |
          set -euo pipefail
          python3 check_localization.py ja
          python3 check_localization.py ja --values

      - name: Reject duplicate Japanese localization keys
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          p = Path('layout/Library/Application Support/BHT/BHTwitter.bundle/ja.lproj/Localizable.strings')
          counts = Counter(re.findall(r'^"([^"]+)"[ \t]*=', p.read_text(), flags=re.M))
          duplicated = [key for key, count in counts.items() if count > 1]
          if duplicated:
              raise SystemExit(f'Duplicate Japanese keys: {duplicated}')
          print(f'Unique Japanese keys: {len(counts)}')
          PY

      - name: Validate local Home settings wiring
        run: |
          set -euo pipefail
          grep -Fq '@"key": @"hide_for_you_tab"' src/Core/BHTSettings.m
          grep -Fq 'numberOfTabsIn:' src/Hooks/HomeBars.x
          grep -Fq 'reloadDataWithSelectingIndex:' src/Hooks/HomeBars.x
          grep -Fq 'attachNeoFreeBirdSettingsGesture' src/Hooks/HomeBars.x
          grep -Fq 'prepareHomeTimelineFollowingForColdLaunch();' src/Hooks/AppLifecycle.x
          grep -Fq 'prepareHomeTimelineFollowingForColdLaunch(void)' src/Hooks/HomeBars.x
          grep -Eq 'Version: [[:digit:]]+[.][[:digit:]]+[.][[:digit:]]+' control

      - name: Validate startup Following and private-build warning handling
        run: |
          set -euo pipefail
          grep -Fq 'attachNeoFreeBirdSettingsGesture' src/Hooks/Settings.x
          grep -Fq 'HomeColdLaunchFollowingPending' src/Hooks/HomeBars.x
          grep -Fq 'HomeColdLaunchUserSelectionEpoch' src/Hooks/HomeBars.x
          grep -Fq 'ReloadHomeTimelineTabsAtIndex(strongSelf, HomeFollowingVisibleIndex())' src/Hooks/HomeBars.x
          grep -Fq 'HomeFollowingVisibleIndex(void)' src/Hooks/HomeBars.x
          if grep -R -n -E 'applyRestoreHomeTabSelectionSetting|saveHomeTimelineSelectionBeforeResignActive|restoreHomeTimelineSelectionAfterBecomeActive|HomeSessionVisibleIndex' src; then
            echo 'Obsolete Home tab restoration code remains.' >&2
            exit 1
          fi
          if grep -Fq 'restore_home_tab_selection' src/Settings/Pages/TimelinesSettingsViewController.m; then
            echo 'Obsolete Restore selected Home tab toggle remains.' >&2
            exit 1
          fi
          grep -Fq 'NFB_LOCAL_PRIVATE_BUILD=1' Makefile
          grep -Fq '#if !defined(NFB_LOCAL_PRIVATE_BUILD)' src/Hooks/AppLifecycle.x
          grep -Fq 'scheduleTestAlertIfNeeded();' src/Hooks/AppLifecycle.x
