name: Stop duplicate v7.3.6 Release overwrite

on:
  push:
    branches:
      - 'automation/cancel-duplicate-v736-20261103'
    paths:
      - '.github/workflows/cancel-duplicate-v736.yml'

permissions:
  actions: write
  contents: read

jobs:
  stop-duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel competing build targeting existing nfb-local-v7.3.6
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OTHER_RUN=41584821787
          RESULT=$(gh api "repos/${GH_REPO}/actions/runs/${OTHER_RUN}" --jq '.status + " " + (.conclusion // "")')
          echo "Before: $RESULT"
          if [[ "$RESULT" == in_progress* ]] || [[ "$RESULT" == queued* ]]; then
            gh api -X POST "repos/${GH_REPO}/actions/runs/${OTHER_RUN}/cancel"
          else
            echo "Competing run has already completed. No cancellation."
          fi
          gh api "repos/${GH_REPO}/actions/runs/${OTHER_RUN}" --jq '{status: .status, conclusion: .conclusion}'
