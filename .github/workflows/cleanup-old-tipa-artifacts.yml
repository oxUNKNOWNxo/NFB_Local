name: Cleanup old NFB_Local TIPA artifacts

on:
  push:
    branches:
      - 'automation/storage-cleanup-20261019'
    paths:
      - '.storage-cleanup-request'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: ${{ github.repository == 'oxUNKNOWNxo/NFB_Local' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove older generated TIPAs and keep v7.2.4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # List all pages. Only local_*.tipa artifacts are eligible.
          gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes, .created_at, .expired] | @tsv' \
            > /tmp/nfb_artifacts.tsv

          KEEP_ID=12122537386
          KEEP_NAME='local_7.2.4_12.33.tipa'
          KEEP_DATE=$(awk -F '\t' -v id="$KEEP_ID" -v n="$KEEP_NAME" \
            '$1 == id && $2 == n { print $4; exit }' /tmp/nfb_artifacts.tsv)

          if [ -z "$KEEP_DATE" ]; then
            echo "Expected latest artifact not found. Refusing deletion." >&2
            exit 1
          fi

          echo "Preserving $KEEP_NAME (artifact $KEEP_ID, created $KEEP_DATE)."
          deleted=0
          freed=0
          while IFS=$'\t' read -r id name size created expired; do
            case "$name" in
              local_*.tipa) ;;
              *) continue ;;
            esac
            if [ "$id" = "$KEEP_ID" ] || [ "$expired" = "true" ]; then
              continue
            fi
            # Preserve all new artifacts (including newer builds).
            if [[ ! "$created" < "$KEEP_DATE" ]]; then
              echo "Preserving newer/equal artifact $id $name."
              continue
            fi
            echo "Deleting older artifact $id ($name, $size bytes, created $created)"
            gh api -X DELETE "repos/${GH_REPO}/actions/artifacts/${id}"
            deleted=$((deleted + 1))
            freed=$((freed + size))
          done < /tmp/nfb_artifacts.tsv

          echo "Deleted $deleted older TIPA artifacts ($freed bytes)."
          echo "Kept latest artifact ID $KEEP_ID."
