name: Apply native reply safety patch

on:
  push:
    branches:
      - 'automation/upstream-v7-work-20261017-webreply-native'
    paths:
      - '.apply-webreply-native-safety'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_webreply_native_safety.py

      - name: Validate
        run: |
          set -euo pipefail
          python3 check_localization.py ja
          python3 check_localization.py ja --values
          grep -Fq 'Version: 7.2.3' control
          grep -Fq 'WebReplyFallbackAllowed' src/Hooks/WebReply.x
          grep -Fq '@"disabled": @YES' src/Core/BHTSettings.m

      - name: Commit patch
        run: |
          set -euo pipefail
          rm -f .apply-webreply-native-safety
          rm -f .github/workflows/apply-webreply-native-safety.yml
          rm -f .github/scripts/apply_webreply_native_safety.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: disable web reply fallback after X error 226'
          git push origin HEAD:${GITHUB_REF_NAME}
