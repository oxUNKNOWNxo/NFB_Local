name: Purge superseded Actions TIPA artifact
on:
  push:
    branches:
      - 'automation/storage-cleanup-20261019-release'
    paths:
      - '.purge-v724-artifact'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm latest private Release and remove old Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = "oxUNKNOWNxo/NFB_Local"
          RELEASE_FILE=$(gh release view nfb-local-v7.2.5 --repo "$GH_REPO" \
            --json assets --jq '.assets[].name')
          test "$RELEASE_FILE" = 'local_7.2.5_12.33.tipa'
          echo 'Confirmed 7.2.5 private Release asset exists.'
          gh api -X DELETE "repos/${GH_REPO}/actions/artifacts/12122537386"
          echo 'Deleted superseded 7.2.4 artifact ID 12122537386.'
