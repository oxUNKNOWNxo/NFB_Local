name: Apply NFB Local changes

on:
  push:
    paths:
      - '.nfb_apply'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply source changes
        run: python3 tools/apply_nfb_local.py

      - name: Check Japanese localization
        run: |
          python3 check_localization.py ja --values
          python3 -c "import check_localization as c; en=c.parse(c.BUNDLE/'en.lproj'/'Localizable.strings'); ja=c.parse(c.BUNDLE/'ja.lproj'/'Localizable.strings'); print('Same value in en/ja:', sum(1 for k in en if k in ja and en[k]==ja[k])); [print('  '+k+' = '+repr(en[k])) for k in en if k in ja and en[k]==ja[k]]"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Core/BHTSettings.m src/Hooks/HomeBars.x src/Settings/Pages/TimelinesSettingsViewController.m "layout/Library/Application Support/BHT/BHTwitter.bundle/en.lproj/Localizable.strings" "layout/Library/Application Support/BHT/BHTwitter.bundle/ja.lproj/Localizable.strings"
          git diff --cached --check
          git commit -m "Add optional For You tab removal and Japanese strings"
          git push
