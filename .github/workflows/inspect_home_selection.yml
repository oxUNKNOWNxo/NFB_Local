name: Inspect Home Selection

on:
  push:
    paths:
      - '.inspect_home_selection'

jobs:
  inspect:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download Twitter 12.31.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/NeoFreeBird/app/releases/download/v7.1.1/NeoFreeBird-trollstore-Twitter_7.1.1_12.31.1.tipa' \
            -o base.tipa
          mkdir extracted
          unzip -q base.tipa -d extracted
          APP=$(find extracted/Payload -maxdepth 2 -type d -name '*.app' | head -n1)
          test -n "$APP"
          BIN=""
          while IFS= read -r candidate; do
            if file "$candidate" 2>/dev/null | grep -q 'Mach-O'; then
              if grep -a -q 'LegacySegmentedViewController' "$candidate" 2>/dev/null; then
                echo "Found LegacySegmentedViewController in: $candidate"
                BIN="$candidate"
                break
              fi
            fi
          done < <(find "$APP/Frameworks" -type f 2>/dev/null | sort)
          if [ -z "$BIN" ]; then
            echo 'No Framework Mach-O containing LegacySegmentedViewController was found.' >&2
            exit 1
          fi
          echo "binary=$BIN" >> "$GITHUB_ENV"

      - name: Inspect LegacySegmentedViewController
        run: |
          set -euo pipefail
          PATTERN='LegacySegmented|selected(Index|Tab|ViewController)|setSelected|select[A-Za-z]*.*(Index|Tab|ViewController)|initiallySelected|current(Index|Tab|ViewController)|setCurrent|scroll[A-Za-z]*.*(Index|Page|ViewController)|page(Index|ViewController)|displayed(Index|ViewController)|visible(Index|ViewController)|selectionOfItem'
          echo "Binary: $binary"
          echo '=== Printable selection strings ==='
          strings "$binary" | grep -Ei "$PATTERN" | sort -u | head -n 2500 || true
          echo '=== Objective-C selection method names ==='
          otool -v -s __TEXT __objc_methname "$binary" 2>/dev/null | grep -Ei "$PATTERN" | head -n 3000 || true
          echo '=== LegacySegmentedViewController class metadata ==='
          otool -ov "$binary" 2>/dev/null | grep -B 20 -A 300 -E '_TtC10TFNUISwift29LegacySegmentedViewController|LegacySegmentedViewController$' | head -n 7000 || true
