name: Apply localization fallback patch

on:
  push:
    branches:
      - 'fix/localization-fallback-20261017'
    paths:
      - '.apply-localization-fallback'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch host localization fallback
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/Hooks/Branding.x')
          text = path.read_text()

          marker = '// MARK: - Rename localized strings\n'
          if 'TwitterHostLocalizationFallbackForKey' not in text:
              helper = r'''// MARK: - Recover host strings when a resource bundle lookup falls through
          //
          // X 12.33 has several toast paths which can ask the wrong NSBundle for a
          // localization key. Foundation then returns the key verbatim even though
          // the translation exists in one of X's Swift-package resource bundles.
          // Load those official tables directly and use them only when %orig is
          // unresolved, so normal localization behavior remains untouched.
          static NSString* TwitterLocalizationBaseLanguage(NSString* language) {
              NSString* normalized =
                  [language stringByReplacingOccurrencesOfString:@"_" withString:@"-"];
              return [normalized componentsSeparatedByString:@"-"].firstObject;
          }

          static NSDictionary<NSString*, NSString*>* TwitterHostLocalizationFallbackTable(void) {
              static NSDictionary<NSString*, NSString*>* table = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  NSString* appLanguage =
                      [[NSBundle mainBundle] preferredLocalizations].firstObject;
                  if (appLanguage.length == 0) {
                      appLanguage = [NSLocale preferredLanguages].firstObject ?: @"en";
                  }

                  NSString* appCode = TwitterLocalizationBaseLanguage(appLanguage);
                  NSMutableDictionary<NSString*, NSString*>* merged =
                      [NSMutableDictionary dictionary];
                  NSArray<NSString*>* bundleNames = @[
                      @"T1Strings_T1Strings.bundle",
                      @"ChatCore_ChatStrings.bundle",
                      @"TwitterSharedStrings_TwitterSharedStrings.bundle"
                  ];

                  for (NSString* bundleName in bundleNames) {
                      NSString* bundlePath =
                          [[[NSBundle mainBundle] bundlePath] stringByAppendingPathComponent:bundleName];
                      NSBundle* resourceBundle = [NSBundle bundleWithPath:bundlePath];
                      if (!resourceBundle) {
                          continue;
                      }

                      NSString* localization =
                          [NSBundle preferredLocalizationsFromArray:resourceBundle.localizations
                                                     forPreferences:@[appLanguage]]
                              .firstObject;
                      if (localization.length == 0 ||
                          ![appCode isEqualToString:
                                       TwitterLocalizationBaseLanguage(localization)]) {
                          continue;
                      }

                      NSString* stringsPath =
                          [resourceBundle pathForResource:@"Localizable"
                                                  ofType:@"strings"
                                             inDirectory:nil
                                         forLocalization:localization];
                      NSData* data = stringsPath ? [NSData dataWithContentsOfFile:stringsPath] : nil;
                      if (!data) {
                          continue;
                      }

                      id plist = [NSPropertyListSerialization propertyListWithData:data
                                                                           options:NSPropertyListImmutable
                                                                            format:NULL
                                                                             error:nil];
                      if (![plist isKindOfClass:[NSDictionary class]]) {
                          continue;
                      }

                      [(NSDictionary*)plist enumerateKeysAndObjectsUsingBlock:^(id key, id value, BOOL* stop) {
                          if ([key isKindOfClass:[NSString class]] &&
                              [value isKindOfClass:[NSString class]]) {
                              merged[key] = value;
                          }
                      }];
                  }

                  table = [merged copy];
              });
              return table ?: @{};
          }

          static NSString* TwitterHostLocalizationFallbackForKey(NSString* key) {
              if (key.length == 0) {
                  return nil;
              }
              NSString* value = TwitterHostLocalizationFallbackTable()[key];
              return [value isKindOfClass:[NSString class]] ? value : nil;
          }

          '''
              if marker not in text:
                  raise SystemExit('Branding.x localization marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''    NSString* result = %orig;\n    if (![BHTSettings boolForKey:@"restore_twitter_names"] ||\n        self == [BHTBundle sharedBundle].mainBundle) {\n        return result;\n    }\n'''
          new = '''    NSString* result = %orig;\n    NSBundle* tweakBundle = [BHTBundle sharedBundle].mainBundle;\n\n    // A valid localized result must not be the key itself. X 12.33 can hit this\n    // path for composition-complete toasts and their action/dismiss labels even\n    // though the Japanese strings are present in the app. Recover the official\n    // value before applying optional Twitter terminology restoration.\n    if (self != tweakBundle && key.length > 0 &&\n        (result.length == 0 || [result isEqualToString:key])) {\n        NSString* fallback = TwitterHostLocalizationFallbackForKey(key);\n        if (fallback.length > 0) {\n            result = fallback;\n        }\n    }\n\n    if (![BHTSettings boolForKey:@"restore_twitter_names"] ||\n        self == tweakBundle) {\n        return result;\n    }\n'''
          if old not in text:
              raise SystemExit('Branding.x NSBundle hook anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          control = Path('control')
          c = control.read_text()
          if 'Version: 7.2.1' not in c:
              raise SystemExit('unexpected local version')
          control.write_text(c.replace('Version: 7.2.1', 'Version: 7.2.2', 1))
          PY

          rm -f .apply-localization-fallback
          rm -f .github/workflows/apply-localization-fallback.yml

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: recover unresolved Twitter localization keys'
          git push origin HEAD:${GITHUB_REF_NAME}
