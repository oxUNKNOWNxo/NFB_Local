name: Inspect upstream Twitter binary

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "NeoFreeBird release tag (blank = latest)"
        default: ""
        required: false
        type: string
  push:
    branches:
      - 'automation/inspect-upstream-*'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Twitter selectors
    runs-on: macos-latest

    steps:
      - name: Resolve official Twitter TrollStore asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG:-}" ]; then
            API_URL="https://api.github.com/repos/NeoFreeBird/app/releases/tags/${REQUESTED_TAG}"
          else
            API_URL="https://api.github.com/repos/NeoFreeBird/app/releases/latest"
          fi

          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | test("^NeoFreeBird-trollstore-Twitter_.*\\.tipa$")) | .browser_download_url' | head -n1)
          ASSET_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | test("^NeoFreeBird-trollstore-Twitter_.*\\.tipa$")) | .name' | head -n1)

          test -n "$TAG"
          test -n "$ASSET_URL"
          test "$ASSET_URL" != "null"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Download and extract
        env:
          ASSET_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 "$ASSET_URL" -o upstream.tipa
          mkdir extracted
          unzip -q upstream.tipa -d extracted
          APP=$(find extracted/Payload -maxdepth 2 -type d -name '*.app' | head -n1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Inspect current X 12.38.1 Explore modules (diagnostic only)
        run: |
          set -euo pipefail
          echo "=== Framework names relevant to search ==="
          find "$APP/Frameworks" -maxdepth 1 -type d | grep -Ei 'Twitter|Search|Explore|Guide|Trend|Discovery' | head -n 100 || true
          echo "=== Swift and ObjC class names from matching Mach-O binaries ==="
          while IFS= read -r -d '' binary; do
            if ! file "$binary" | grep -q 'Mach-O'; then
              continue
            fi
            matches=$(strings -a "$binary" 2>/dev/null | grep -Ei '(Guide|Explore|Trend|Discovery|Search).*ViewController|T1TwitterSwift.*Guide|tfn_navigationBarAccessoryView' | head -n 55 || true)
            if [ -n "$matches" ]; then
              echo "=== $binary ==="
              echo "$matches"
            fi
          done < <(find "$APP" -type f -print0)
          echo "=== T1TwitterSwift main framework ObjC selectors, if present ==="
          BINARY="$APP/Frameworks/T1TwitterSwift.framework/T1TwitterSwift"
          if [ -f "$BINARY" ]; then
            echo "--- strings Guide/Explore/Trend classes ---"
            strings -a "$BINARY" | grep -Ei 'Guide|Explore|TrendsSidebar|Trending.*View|Search.*View|Navigation.*Accessory' | head -n 160 || true
            echo "--- ObjC metadata Guide/Explore/Trend classes ---"
            otool -ov "$BINARY" > /tmp/nfb-current-explore-objc.txt 2>/dev/null || true
            grep -n -E 'Guide.*ViewController|Explore.*ViewController|Trend.*ViewController|Search.*ViewController|tfn_navigationBarAccessoryView' /tmp/nfb-current-explore-objc.txt | head -n 120 || true
            echo "--- matching metadata context (first names) ---"
            grep -n -A 110 -B 7 -E 'name .*Guide.*ViewController|name .*Explore.*ViewController' /tmp/nfb-current-explore-objc.txt | head -n 500 || true
          else
            echo "No T1TwitterSwift standalone framework found"
          fi

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-binary-inspection
          path: |
            selector-report.txt
            selector-matches.txt
            home-objc-metadata.txt
          if-no-files-found: warn
