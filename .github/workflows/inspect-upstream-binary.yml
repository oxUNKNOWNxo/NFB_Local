name: Inspect upstream Twitter binary

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "NeoFreeBird release tag (blank = latest)"
        default: ""
        required: false
        type: string
  push:
    branches:
      - 'automation/inspect-upstream-*'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Twitter selectors
    runs-on: macos-latest

    steps:
      - name: Resolve official Twitter TrollStore asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG:-}" ]; then
            API_URL="https://api.github.com/repos/NeoFreeBird/app/releases/tags/${REQUESTED_TAG}"
          else
            API_URL="https://api.github.com/repos/NeoFreeBird/app/releases/latest"
          fi

          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | test("^NeoFreeBird-trollstore-Twitter_.*\\.tipa$")) | .browser_download_url' | head -n1)
          ASSET_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | test("^NeoFreeBird-trollstore-Twitter_.*\\.tipa$")) | .name' | head -n1)

          test -n "$TAG"
          test -n "$ASSET_URL"
          test "$ASSET_URL" != "null"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Download and extract
        env:
          ASSET_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 "$ASSET_URL" -o upstream.tipa
          mkdir extracted
          unzip -q upstream.tipa -d extracted
          APP=$(find extracted/Payload -maxdepth 2 -type d -name '*.app' | head -n1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Inspect GuideContainerViewController in T1Twitter binary
        run: |
          set -euo pipefail
          BINARY="$APP/Frameworks/T1Twitter.framework/T1Twitter"
          test -f "$BINARY"
          echo "=== Class and relevant selector names ==="
          strings -a "$BINARY" | grep -Ei '(Guide|Explore|Trending|Tab|Segment|Page|Navigation).*(Controller|DataSource|Delegate|Index|Selection)' | sort -u | head -n 270 || true
          echo "=== ObjC metadata positions ==="
          otool -ov "$BINARY" > /tmp/nfb-guide-objc.txt
          grep -n -E 'GuideContainerViewController|TrendingPageViewController|TrendingHeaderViewController|TrendsLandingViewController|tfn_navigationBarAccessoryView' /tmp/nfb-guide-objc.txt | head -n 80 || true
          echo "=== GuideContainer ObjC class neighborhoods ==="
          grep -n -B 190 -A 220 -F '_TtC14T1TwitterSwift28GuideContainerViewController' /tmp/nfb-guide-objc.txt | head -n 850 || true
          echo "=== Trending page neighborhoods ==="
          grep -n -B 120 -A 160 -F '_TtC14T1TwitterSwift26TrendingPageViewController' /tmp/nfb-guide-objc.txt | head -n 420 || true
          echo "=== Search and guide-specific ObjC method names ==="
          grep -E 'name +.*(guide|Guide|trending|Trending|explore|Explore|tabs|Tabs|tabAtIndex|TabAtIndex|segment|Segment|navigationBarAccessoryView)' /tmp/nfb-guide-objc.txt | sort -u | head -n 330 || true
          echo "=== Swift symbols ==="
          nm -a "$BINARY" 2>/dev/null | xcrun swift-demangle 2>/dev/null | grep -Ei 'GuideContainerViewController|TrendingPageViewController|TrendingHeaderViewController' | head -n 160 || true

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-binary-inspection
          path: |
            selector-report.txt
            selector-matches.txt
            home-objc-metadata.txt
          if-no-files-found: warn
