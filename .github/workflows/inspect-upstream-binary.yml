name: Inspect upstream Twitter binary

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "NeoFreeBird release tag (blank = latest)"
        default: ""
        required: false
        type: string
  push:
    branches:
      - 'automation/inspect-upstream-*'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Twitter selectors
    runs-on: macos-latest

    steps:
      - name: Resolve official Twitter TrollStore asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG:-}" ]; then
            API_URL="https://api.github.com/repos/NeoFreeBird/app/releases/tags/${REQUESTED_TAG}"
          else
            API_URL="https://api.github.com/repos/NeoFreeBird/app/releases/latest"
          fi

          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | test("^NeoFreeBird-trollstore-Twitter_.*\\.tipa$")) | .browser_download_url' | head -n1)
          ASSET_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | test("^NeoFreeBird-trollstore-Twitter_.*\\.tipa$")) | .name' | head -n1)

          test -n "$TAG"
          test -n "$ASSET_URL"
          test "$ASSET_URL" != "null"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Download and extract
        env:
          ASSET_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 "$ASSET_URL" -o upstream.tipa
          mkdir extracted
          unzip -q upstream.tipa -d extracted
          APP=$(find extracted/Payload -maxdepth 2 -type d -name '*.app' | head -n1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Inspect Explore URT Chrome and segmented view classes
        run: |
          set -euo pipefail
          BIN="$APP/Frameworks/T1Twitter.framework/T1Twitter"
          echo "=== URTChrome, Guide and native segmented symbols ==="
          nm -a "$BIN" 2>/dev/null | xcrun swift-demangle 2>/dev/null | grep -E 'URTChromeViewController|GuideContainerViewController|LegacySegmentedViewController|TrendingPageViewController' | head -n 410 || true
          echo "=== Guide and Chrome feature strings ==="
          strings -a "$BIN" | grep -Ei '(^|[^a-z])(trending|trends|explore|guide|new_explore)([^a-z]|$)|contentTabs|selectedTabID|guide_dynamic' | sort -u | head -n 190 || true
          echo "=== Segmented class metadata ==="
          otool -ov "$BIN" > /tmp/exploreobjc.txt
          grep -n -B 3 -A 90 -F '_OBJC_CLASS_$__TtC10TFNUISwift29LegacySegmentedViewController' /tmp/exploreobjc.txt | head -n 120 || true
          echo "=== Guide parent metadata ==="
          grep -n -B 3 -A 150 -F '_OBJC_CLASS_$__TtC14T1TwitterSwift28GuideContainerViewController' /tmp/exploreobjc.txt | head -n 165 || true
          echo "=== Native segmented method selectors ==="
          strings -a "$BIN" | grep -E '^(setDataSource:|dataSource|reloadDataWithSelectingIndex:|reloadData|setCurrentIndex:|currentIndex|setDelegate:|numberOfTabsIn:|segmentedViewController:descriptorAtIndex:)$' | sort -u || true
          echo "=== Swift segmented in embedded UI framework ==="
          for BB in "$APP/Frameworks/TFNUISwift.framework/TFNUISwift" "$APP/Frameworks/TFNUI.framework/TFNUI"; do
            if [ -f "$BB" ]; then
              echo "-- Framework: $BB"
              nm -a "$BB" 2>/dev/null | xcrun swift-demangle 2>/dev/null | grep -E 'LegacySegmentedViewController|LegacyTabDescriptor' | head -n 105 || true
              otool -ov "$BB" > /tmp/explore-seg-objc.txt
              grep -n -B 2 -A 200 -F '_OBJC_CLASS_$__TtC10TFNUISwift29LegacySegmentedViewController' /tmp/explore-seg-objc.txt | head -n 218 || true
            fi
          done

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-binary-inspection
          path: |
            selector-report.txt
            selector-matches.txt
            home-objc-metadata.txt
          if-no-files-found: warn
