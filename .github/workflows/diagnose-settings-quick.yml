name: Quick settings class inventory

on:
  push:
    branches:
      - 'automation/diagnose-settings-20261103'
    paths:
      - '.github/workflows/diagnose-settings-quick.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory settings classes from official Twitter 12.38.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://github.com/NeoFreeBird/app/releases/download/v7.3.0/NeoFreeBird-trollstore-Twitter_7.3.0_12.38.1.tipa' -o /tmp/tipa.zip
          mkdir /tmp/tipa
          unzip -q /tmp/tipa.zip -d /tmp/tipa
          for target in \
            /tmp/tipa/Payload/Twitter.app/Twitter \
            /tmp/tipa/Payload/Twitter.app/Frameworks/T1Twitter.framework/T1Twitter \
            /tmp/tipa/Payload/Twitter.app/Frameworks/XServiceLibraries.framework/XServiceLibraries; do
            echo "== $target =="
            strings -a "$target" | grep -Ei '^([_A-Za-z0-9.$]+)?(Settings|Preferences)(AndPrivacy)?(ViewController|RootViewController|NavigationController)$|T1(Generic)?SettingsViewController|updatedSections:forStyle:|setSections:' | sort -u | head -n 250 || true
            echo "== Near settings source class names =="
            strings -a "$target" | grep -Ei 'Settings.*ViewController' | sort -u | grep -v -E '^[_A-Za-z0-9.$]{200,}$' | head -n 160 || true
          done
