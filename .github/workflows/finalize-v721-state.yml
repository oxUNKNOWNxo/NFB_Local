name: Finalize v7.2.1 project state

on:
  push:
    branches:
      - main
    paths:
      - '.finalize-v721-state'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update PROJECT_STATE.md
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize_v721_state.py
          rm -f .finalize-v721-state
          rm -f .github/scripts/finalize_v721_state.py
          rm -f .github/workflows/finalize-v721-state.yml

      - name: Commit finalized state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: update project state for NFB_Local 7.2.1'
          git push origin HEAD:main
