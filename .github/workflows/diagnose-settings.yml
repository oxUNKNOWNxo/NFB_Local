name: Diagnose X 12.38.1 settings entry compatibility

on:
  push:
    branches:
      - 'automation/diagnose-settings-20261103'
    paths:
      - '.github/workflows/diagnose-settings.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Inspect official Twitter 12.38.1 binary selectors
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/NeoFreeBird/app/releases/download/v7.3.0/NeoFreeBird-trollstore-Twitter_7.3.0_12.38.1.tipa' \
            -o /tmp/xbase.tipa
          mkdir -p /tmp/xbase
          unzip -q /tmp/xbase.tipa -d /tmp/xbase
          APP=$(find /tmp/xbase/Payload -maxdepth 2 -type d -name '*.app' | head -n1)
          test -n "$APP"
          MAIN_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          MAIN="$APP/$MAIN_NAME"
          printf 'App: %s\nMain: %s\n' "$APP" "$MAIN"

          cat >/tmp/tokens.txt <<'EOF'
          T1GenericSettingsViewController
          T1SettingsViewController
          TFNItemsDataViewController
          TFNSettingsNavigationItem
          updatedSections:forStyle:
          setSections:
          viewWillAppear:
          SettingsViewController
          SettingsRootViewController
          SettingsAndPrivacy
          SettingsNavigationItem
          EOF
          sed -i '' 's/^          //' /tmp/tokens.txt

          echo '=== App settings controller candidates ==='
          for target in "$MAIN" \
              "$APP/Frameworks/T1Twitter.framework/T1Twitter" \
              "$APP/Frameworks/XAppLibraries.framework/XAppLibraries" \
              "$APP/Frameworks/XServiceLibraries.framework/XServiceLibraries"; do
            test -f "$target" || continue
            echo "### ${target#$APP/}"
            strings -a "$target" 2>/dev/null | \
              grep -Ei '(^|[^a-zA-Z])(Settings|Preferences|Account).*ViewController|SettingsNavigationItem|updatedSections:forStyle:|setSections:' | \
              sort -u | head -n 240 || true
            echo '### ObjC settings class symbols'
            nm -m "$target" 2>/dev/null | grep -Ei 'OBJC_CLASS_.*(Settings|Preferences)' | head -n 60 || true
          done

          echo '=== Specific required old class names and selectors ==='
          for token in T1GenericSettingsViewController T1SettingsViewController TFNItemsDataViewController updatedSections:forStyle: setSections:; do
            echo "TOKEN $token"
            for target in "$MAIN" "$APP/Frameworks/T1Twitter.framework/T1Twitter" "$APP/Frameworks/XAppLibraries.framework/XAppLibraries" "$APP/Frameworks/XServiceLibraries.framework/XServiceLibraries"; do
              test -f "$target" || continue
              if strings -a "$target" | grep -Fq "$token"; then
                echo "  PRESENT ${target#$APP/}"
              fi
            done
          done
