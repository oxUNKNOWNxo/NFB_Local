name: Inspect Home Timeline

on:
  push:
    paths:
      - '.inspect_home'

jobs:
  inspect:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download upstream TrollStore package
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/NeoFreeBird/app/releases/download/v7.1.1/NeoFreeBird-trollstore-Twitter_7.1.1_12.31.1.tipa' \
            -o base.tipa
          mkdir extracted
          unzip -q base.tipa -d extracted
          APP=$(find extracted/Payload -maxdepth 2 -type d -name '*.app' | head -n1)
          BIN="$APP/Twitter"
          test -f "$BIN"
          echo "binary=$BIN" >> "$GITHUB_ENV"

      - name: Inspect Home timeline symbols
        run: |
          set -euo pipefail
          echo '=== Matching printable strings ==='
          strings "$binary" | grep -Ei 'HomeTimelineContainer|numberOfTabs|unifiedSegmented|scrollingSegmented|TimelineVariant|lastSelectedTimelineTabIdentifier|ForYou|Following|latest' | sort -u | head -n 1000 || true
          echo '=== Objective-C method names ==='
          otool -v -s __TEXT __objc_methname "$binary" 2>/dev/null | grep -Ei 'Home|Timeline|Tab|Segment|Variant|Following|ForYou|latest' | head -n 1500 || true
          echo '=== Objective-C class names ==='
          otool -v -s __TEXT __objc_classname "$binary" 2>/dev/null | grep -Ei 'Home|Timeline|Segment' | head -n 800 || true
